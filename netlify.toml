[build]
  command = "npm run build"
  publish = "dist"


[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

# Allow the Concenedo webcam source through Netlify Image CDN
# (/.netlify/images?url=... rejects remote domains not listed here).
[images]
  remote_images = ["https://www\\.caiseregno\\.it/webcam_concenedo/.*"]

# ── SEO redirects ──────────────────────────────────────────────────────
# The redesign moved the post listings from /blog/* to the site root:
# /blog → /, /blog/scialpinismo → /scialpinismo, /blog/2 → /2, and the
# /blog/mappa/* map views merged into the category pages. Old URLs are
# indexed and linked from outside: 301 them to their new homes.

[[redirects]]
  from = "/blog"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog/mappa"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog/mappa/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/:splat"
  status = 301

# Portfolio page 1 used to live at /portfolio/1 (master redirected
# /portfolio there); the redesign inverts it: page 1 is /portfolio.
[[redirects]]
  from = "/portfolio/1"
  to = "/portfolio"
  status = 301

# Pre-redesign per-photo permalinks (e.g. .../post-slug/photo-3 or
# .../post-slug/some-caption-slug-id) lived one segment under the post URL.
# The gallery is now an in-page <dialog>, so that segment no longer routes
# anywhere; still-indexed/crawled links 404. Post URLs are always exactly
# /category/year/month/day/slug (5 segments), so a 6th segment is a
# leftover photo permalink — send it back to the post.
#
# NB: this MUST use a named 6th placeholder (:photo), not a trailing splat.
# Netlify matches redirects trailing-slash-insensitively and a splat also
# matches the empty string, so `/:slug/*` matched the canonical post URL
# itself (`/…/slug/`) and 301'd it to `/…/slug`, which normalizes straight
# back — an infinite loop that broke every post. `:photo` requires a real
# segment, so it can never match the bare post URL.
#
# `astro dev` runs the Netlify edge dev emulator, which applies these
# redirects locally too. The rule below collapses ANY 6-segment path to 5,
# and Vite's internal dev module URLs under /@id are 6 segments (e.g.
# /@id/astro/runtime/client/dev-toolbar/entrypoint.js) — without this
# passthrough that URL 301s and the dev toolbar silently fails to load.
# First match wins, so /@* modules are served (via Vite) before the collapse
# rule is reached. Production never receives /@* requests, so it's a no-op
# there. NB: do NOT add a /node_modules/* passthrough — the emulator would
# serve those raw off disk, bypassing Vite's transform (breaks env.mjs's
# __DEFINES__), and those internal paths aren't 6 segments anyway.
[[redirects]]
  from = "/@*"
  to = "/@:splat"
  status = 200
[[redirects]]
  from = "/:category/:year/:month/:day/:slug/:photo"
  to = "/:category/:year/:month/:day/:slug"
  status = 301

# ── Cache headers ──────────────────────────────────────────────────────
# Astro-generated assets have content hashes in filenames — cache forever
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# GPX files rarely change — cache for 7 days
[[headers]]
  for = "/gpx/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Public images (og, favicon, etc.) — rarely change
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
